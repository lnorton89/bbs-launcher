[bbs]
title = "Lawrence's Launcher"
subtitle = "Terminal Launcher v0.1"
# Banner font: "shadow" (solid fill, default) or "lined" (same letterforms, horizontal-line fill)
banner_style = "shadow"
# Accent color for banner, borders, and highlight. Any named color
# (cyan, magenta, green, yellow, red, blue, white, ...) or "rainbow"
# to cycle the accent through the full hue wheel.
theme = "rainbow"
# Slow color shimmer on the banner (true by default). Also drives the
# border chase; set false to freeze both into a static gradient.
banner_animation = true
# Travelling light around every pane border (true by default). Under
# "rainbow" it sweeps the hue wheel; under a solid theme it chases a dim
# band through the theme color.
border_chase = true
# Seconds for the chase to travel one full lap of a pane. Lower is
# faster. Clamped to 0.5-600; default 12.
chase_lap_secs = 12.0
# Starting in-category order of menu items: config (default), launches
# (most launched first), or recent (most recently launched first).
# Press `s` in the menu to cycle through them live.
# menu_sort = "config"
# Scrolling message-of-the-day ticker under the banner. Remove or empty
# this list to hide the ticker row entirely.
motd = [
  "Welcome back, Lawrence",
  "Press / to search, ? for help",
  "← / → folds and unfolds categories",
]

# Items sharing a `category` are grouped under a foldable header, in the
# order the categories first appear below. Items with no category are
# listed last, ungrouped.

[[items]]
key = "1"
label = "Claude Code"
cmd = "claude"
desc = "AI coding assistant"
icon = "CC"
color = "cyan"
category = "Develop"

[[items]]
key = "2"
label = "Freebuff"
cmd = "freebuff"
desc = "AI coding assistant"
icon = "FB"
color = "green"
category = "Develop"

[[items]]
key = "3"
label = "Kilo"
cmd = "kilo"
desc = "AI coding agent CLI"
icon = "K"
color = "magenta"
category = "Develop"

[[items]]
key = "8"
label = "Python REPL"
cmd = "python"
desc = "Python interactive"
icon = "PY"
color = "yellow"
category = "Develop"

[[items]]
key = "5"
label = "Git Status"
cmd = "git status"
desc = "Check git status"
icon = "GS"
color = "yellow"
category = "Source Control"
# Wait for Enter before returning to the menu, so the output doesn't vanish
pause = true

[[items]]
key = "6"
label = "Lazygit"
cmd = "lazygit"
desc = "Git TUI"
icon = "LG"
color = "red"
category = "Source Control"

[[items]]
key = "9"
label = "GitHub"
# No `cmd`: this item opens the built-in GitHub dashboard screen.
desc = "All-in-one GitHub dashboard"
icon = "GH"
color = "white"
screen = "github"
category = "Source Control"

[[items]]
key = "4"
label = "Netlify CLI"
cmd = "netlify"
desc = "Deploy to Netlify"
icon = "NT"
color = "blue"
category = "System"

[[items]]
key = "7"
label = "Btop"
cmd = "btop"
desc = "System monitor"
icon = "BT"
color = "green"
wsl = true
category = "System"

[[items]]
key = "B"
label = "Bluetti"
# No `cmd`: opens the built-in Bluetti power-station monitor screen,
# fed by the bluetti-mqtt-node bridge over MQTT.
desc = "Power station live stats"
icon = "PW"
color = "yellow"
screen = "bluetti"
category = "System"

[[items]]
key = "Q"
label = "Quit"
cmd = "exit"
desc = "Close launcher"
icon = "QQ"
color = "red"

# Customize the GitHub dashboard screen. Omit this whole section for
# defaults: all six sections, 25 per page, refresh every 120s.
[github]
# Sections shown, in order. Unknown names are ignored. Uncomment to
# pick a subset:
# sections = ["notifications", "pull_requests", "issues", "repos", "stars", "gists", "profile"]
per_page = 25
refresh_secs = 120
# Starting sort for the Repos tab: pushed (default), stars, forks,
# issues, or name. Press `s` on the tab to cycle through them live.
# repo_sort = "pushed"
# Repo affiliation for the Issues and Pull Requests sections: comma-
# separated subset of owner, collaborator (write access), and
# organization_member. Defaults to all three.
# affiliation = "owner,collaborator,organization_member"

# The Bluetti screen subscribes to the MQTT state topics published by
# bluetti-mqtt-node. Everything here is optional — the defaults match a
# local bridge (mqtt://127.0.0.1:1883, topics under bluetti/state/...).
[bluetti]
broker = "mqtt://127.0.0.1:1883"
# Only show one device; omit to show every device on the broker.
# device = "AC500-2237000003358"
# topic_prefix = "bluetti"
